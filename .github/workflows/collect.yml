name: GDELT gyűjtés

on:
  schedule:
    - cron: "17 * * * *"        # óránként (a GitHub néha késve indítja, a program ezt pótolja)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Hány napra visszamenőleg töltse fel (0 = csak az új adatok)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: gdelt-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adatgyűjtés
        run: python collect.py --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"

      - name: Mentés a tárolóba
        run: |
          git config user.name "gdelt-gyujto"
          git config user.email "actions@users.noreply.github.com"
          git add data/counts.csv
          if git diff --cached --quiet; then
            echo "nincs új adat"
          else
            git commit -m "adat: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
